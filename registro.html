<!DOCTYPE html>
<html lang="en">

    <link rel="stylesheet" href="css/registro.css">

    <title>Registro</title>
</head>
<body>

          <div class="tittleRegistro-box">
        <h1> Regístrate </h1>
          </div>

         <form action="" method="post">

        <div class="cuadroCentral-box" >
    
        <div>
        <label for="">Nombre completo</label>
        <input type="text" required>
        </div>

        <div>
        <label for="">Correo electronico</label>
        <input type="email" required>
        </div>

        <div>
        <label for="">Ingrese su contraseña</label>
        <input type="password" required>
        </div>
  
        <div>
        <label for="">Confirmar contraseña</label>
        <input type="password" required>
        </div>

        <div>
        <button type="submit" class="botonEnviar-box">
            Enviar
        </button>
        </div>
        </div>
        
        </form>
    <div class="VolverMenu-box">
        <a href="menu_principal.html">       
        <button class="botonVolver-box">
            Volver al menú principal
        </button></a>
    </div>

    <div class="IniciarSesion-box">
        <h3>¿Ya tienes una cuenta? 
            <br>
            <div class="LinkSesion">
            <a href="iniciar-sesion.html">Inicia Sesión</a> </h3>
            </div>
     </div>
